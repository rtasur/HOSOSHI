services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoshoshi}
      POSTGRES_USER: ${POSTGRES_USER:-hoshoshi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoshoshi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-hoshoshi_neo4j_dev}
      HEALTHCHECK_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-hoshoshi_neo4j_dev}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -u neo4j -p "$${HEALTHCHECK_NEO4J_PASSWORD}" "RETURN 1" >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: on-failure
    environment:
      DATABASE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-hoshoshi}
      DATABASE_USERNAME: ${POSTGRES_USER:-hoshoshi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-hoshoshi_dev_password}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-hoshoshi_neo4j_dev}
      SERVER_PORT: 8080
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set; run START-HOSOSHI.cmd first}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-120}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-123456}
      STORAGE_PATH: ${STORAGE_PATH:-/app/data/uploads}
      API_ENCRYPTION_ENABLED: ${API_ENCRYPTION_ENABLED:-true}
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:?API_ENCRYPTION_KEY must be set; run START-HOSOSHI.cmd first}
    ports:
      - "8081:8080"
    volumes:
      - evidence_data:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:?API_ENCRYPTION_KEY must be set; run START-HOSOSHI.cmd first}
    restart: unless-stopped
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:

  evidence_data:
