spring:
  application:
    name: criminal-network-intelligence-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hoshoshi}
    username: ${DATABASE_USERNAME:hoshoshi}
    password: ${DATABASE_PASSWORD:hoshoshi_dev_password}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:hoshoshi_neo4j_dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
  storage:
    path: ${STORAGE_PATH:./data/uploads}
  api-encryption:
    enabled: ${API_ENCRYPTION_ENABLED:false}
    key: ${API_ENCRYPTION_KEY:}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:123456}
