spring:
  application:
    name: criminal-network-intelligence-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hoshoshi}
    username: ${DATABASE_USERNAME:hoshoshi}
    password: ${DATABASE_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:hoshoshi_dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:cni-local-dev-secret-change-me-please-32-chars-minimum}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
  storage:
    path: ${STORAGE_PATH:./data/uploads}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:123456}
